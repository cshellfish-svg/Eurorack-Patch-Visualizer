<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patch Tool</title><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#17181b;--panel:#1e2024;--b:#3a3e45;--txt:#e9e7e1;--dim:#8b8d93;--faint:#55585f;--rail:#0f1012;--ok:#6fcf97;--blue:#4f9fe0;--danger:#e0594f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,sans-serif;user-select:none}header{padding:16px 24px 12px;border-bottom:1px solid #2d3035;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0}.filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.fname,select{background:var(--panel);border:1px solid var(--b);color:var(--txt);border-radius:4px;padding:7px 10px;font:12px Inter}.btn{font-weight:600;cursor:pointer}.btn:disabled,.fname:disabled{opacity:.4}input[type=file]{display:none}#status{font-size:12px;color:var(--faint)}.layout{display:flex;flex-wrap:wrap}.rail{flex:0 0 220px;background:var(--rail);padding:16px 14px;border-right:1px solid #2d3035}.rail h2{font-size:10px;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}.rail h2:first-child{margin-top:0}.layer{display:flex;gap:8px;padding:6px}.layer input{display:none}.swatch{width:11px;height:11px;border-radius:3px;opacity:.3}.layer input:checked+.swatch{opacity:1}.layer span:last-child{color:var(--dim);font-size:12px}.canvas-outer{flex:1;overflow:auto;max-height:calc(100vh - 60px)}.canvas{position:relative;min-width:640px;padding:20px 28px 60px}.rowblock{margin-bottom:26px}.rowlabel{font:10px 'JetBrains Mono';color:var(--faint);letter-spacing:.07em;margin-bottom:8px}.rowmods{display:flex;flex-wrap:wrap;gap:10px}.modbox{position:relative;width:300px;flex:0 0 300px;background:var(--panel);border:1px solid var(--b);border-radius:5px;transition:opacity .15s}.modbox.dim{opacity:.22}.modhead{padding:7px 8px;border-bottom:1px solid #2d3035;display:flex;justify-content:space-between;cursor:pointer}.modname{font:600 11px 'JetBrains Mono'}.modsub{font-size:9px;color:var(--faint)}.ports{padding:3px 0}.pair,.pop-pair{display:grid;grid-template-columns:1fr 1fr}.cell,.bi{height:20px;display:flex;align-items:center;gap:4px;padding:0 6px;color:var(--dim);font:9.5px 'JetBrains Mono';cursor:pointer;min-width:0}.cell:hover,.bi:hover,.popcell:hover{background:#25282f}.cell.out{justify-content:flex-end;border-left:1px solid #2d3035}.cell.out .pname{order:-1;text-align:right}.bi{justify-content:center}.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:9px;height:9px;flex:0 0 9px;border:1.6px solid var(--faint);border-radius:50%;background:var(--rail)}.dot.default{background:var(--ok);border-color:var(--ok)}.dot.has-cable{border-color:var(--txt)}.dot.armed{background:#fff;box-shadow:0 0 0 3px #fff4}.more{width:18px;height:15px;background:transparent;color:var(--faint);border:1px solid var(--b);cursor:pointer}.more.marked{color:var(--blue);border-color:var(--blue)}.popover{display:none;position:absolute;z-index:10;top:calc(100% + 2px);left:0;width:100%;background:#1c1e22;border:1px solid var(--b);border-radius:5px;padding:4px 0;box-shadow:0 8px 24px #0009;max-height:280px;overflow:auto}.popover.show{display:block}.popcell{height:22px;display:flex;align-items:center;gap:4px;padding:0 6px;color:var(--dim);font:10px 'JetBrains Mono';cursor:pointer;min-width:0}.popcell.out{justify-content:flex-end;border-left:1px solid #2d3035}.popcell.out .pname{order:-1;text-align:right}.popbi{height:22px;display:flex;justify-content:center;align-items:center;gap:4px;color:var(--dim);font:10px 'JetBrains Mono';cursor:pointer}.popcell.visible,.popbi.visible{color:var(--txt)}.popcell.locked,.popbi.locked{opacity:.65;cursor:not-allowed}.state{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--blue)}.state.active{background:var(--ok)}svg#cables{position:absolute;top:0;left:0;pointer-events:none}path.cable{fill:none;stroke-width:1.7;pointer-events:stroke;cursor:pointer}path.dragline{fill:none;stroke:#fff;stroke-dasharray:3 3}#empty{text-align:center;padding:60px;color:var(--dim)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);opacity:0;background:#23262b;padding:9px 16px;border:1px solid var(--b);border-radius:5px}#toast.show{opacity:1}@media(max-width:900px){.rail{flex:1 1 100%;border-right:0;border-bottom:1px solid #2d3035}}</style></head><body><header><h1>Patch Tool</h1><div class="filebar"><button class="btn" id="load">XML laden</button><input id="file" type="file" accept=".xml,text/xml"><input id="name" class="fname" placeholder="dateiname.xml" disabled><button class="btn" id="save" disabled>Als XML speichern</button><span id="status">Keine Datei geladen.</span></div></header><div class="layout"><nav class="rail"><h2>Signal-Layer</h2><div id="layers"></div><h2>Stimme isolieren</h2><select id="voice"><option value="">— keine —</option></select></nav><main class="canvas-outer"><div class="canvas" id="canvas"><div id="empty"><h2>Noch keine Konfiguration geladen</h2><p>Lade deine XML-Datei.</p></div></div></main></div><div id="toast"></div><script>(()=>{'use strict';const full_labels=true;let S,doc,next=1,active=new Set,selected='',armed,els={};const $=x=>document.getElementById(x),K=(m,p)=>m+'.'+p,mod=id=>S.modules.find(m=>m.id===id),port=(m,p)=>mod(m)?.ports.find(x=>x.id===p),label=p=>full_labels?(p.name||p.abbr):(p.abbr||p.name),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));function toast(x){$('toast').textContent=x;$('toast').className='show';setTimeout(()=>$('toast').className='',2200)}function cable(m,p){return S.connections.some(c=>c.fromMod===m&&c.fromPort===p||c.toMod===m&&c.toPort===p)}function visible(m,p){return p.defaultActive||cable(m,p.id)}function toggle(m,p){if(cable(m,p.id)){toast('Verkabelte Ports können nicht ausgeblendet werden.');return}p.defaultActive=!p.defaultActive;render()}function resolve(am,ap,bm,bp){let a=port(am,ap),b=port(bm,bp);if(!a||!b)return null;if(a.direction==='in'&&b.direction==='in'||a.direction==='out'&&b.direction==='out')return null;if(a.direction==='out'||a.direction==='bidirectional'&&b.direction==='in')return{fromMod:am,fromPort:ap,toMod:bm,toPort:bp};return{fromMod:bm,fromPort:bp,toMod:am,toPort:ap}}function add(am,ap,bm,bp){let x=resolve(am,ap,bm,bp);if(!x){toast('Ungültige Verbindung.');return}S.connections.push({id:'c'+next++,...x});render()}function center(e){let c=$('canvas').getBoundingClientRect(),r=e.getBoundingClientRect();return{x:r.left+r.width/2-c.left+$('canvas').scrollLeft,y:r.top+r.height/2-c.top+$('canvas').scrollTop}}function connectView(start){if(!start)return null;let seen=new Set([start]),again=true;while(again){again=false;S.connections.forEach(c=>{if(seen.has(c.fromMod)&&!seen.has(c.toMod))seen.add(c.toMod),again=true;if(seen.has(c.toMod)&&!seen.has(c.fromMod))seen.add(c.fromMod),again=true})}return seen}function draw(){let svg=$('cables');if(!svg)return;svg.querySelectorAll('.cable').forEach(x=>x.remove());let reach=connectView(selected);S.connections.forEach(c=>{let a=els[K(c.fromMod,c.fromPort)],b=els[K(c.toMod,c.toPort)];if(!a||!b)return;let p=document.createElementNS('http://www.w3.org/2000/svg','path'),x=center(a),y=center(b);p.setAttribute('class','cable');p.setAttribute('d',`M${x.x} ${x.y} L${y.x} ${y.y}`);p.setAttribute('stroke',S.layers.find(l=>l.id===port(c.fromMod,c.fromPort).layer)?.color||'#888');if(!active.has(port(c.fromMod,c.fromPort).layer))p.style.display='none';p.ondblclick=()=>{S.connections=S.connections.filter(z=>z.id!==c.id);render()};svg.append(p)});document.querySelectorAll('.modbox').forEach(b=>b.classList.toggle('dim',!!reach&&!reach.has(b.dataset.mod)))}function bind(d,m,p,row){d.onmousedown=e=>{e.preventDefault();if(armed){if(armed.m!==m||armed.p!==p)add(armed.m,armed.p,m,p);armed=null;render();return}armed={m,p};d.classList.add('armed')};row.ondblclick=()=>{for(let i=S.connections.length-1;i>=0;i--){let c=S.connections[i];if(c.fromMod===m&&c.fromPort===p||c.toMod===m&&c.toPort===p){S.connections.splice(i,1);render();break}}}}function dot(m,p){let d=document.createElement('span');d.className='dot'+(p.defaultActive?' default':'');d.dataset.mod=m.id;d.dataset.port=p.id;els[K(m.id,p.id)]=d;return d}function moduleCell(m,p,side){let r=document.createElement('div');r.className=side==='bi'?'bi':'cell '+side;let d=dot(m,p),n=document.createElement('span');n.className='pname';n.textContent=label(p);r.append(d,n);bind(d,m.id,p.id,r);return r}function popCell(m,p,side){let r=document.createElement('div');r.className=side==='bi'?'popbi':'popcell '+side;let d=document.createElement('span');d.className='state'+(p.defaultActive?' active':'');let n=document.createElement('span');n.className='pname';n.textContent=label(p);r.append(d,n);r.classList.toggle('visible',visible(m.id,p));let locked=cable(m.id,p.id);r.classList.toggle('locked',locked);if(!locked)r.onclick=e=>{e.stopPropagation();toggle(m.id,p)};if(locked)r.append('🔒');return r}function render(){let c=$('canvas');c.innerHTML='';els={};if(!S){c.innerHTML=$('empty').outerHTML;return}let rows={};S.functions.forEach(f=>(rows[f.row]??={label:f.label,ids:[]}).ids.push(f.id));Object.keys(rows).sort((a,b)=>a-b).forEach(k=>{let r=rows[k],sec=document.createElement('section');sec.className='rowblock';sec.innerHTML=`<div class="rowlabel">${esc(r.label).toUpperCase()}</div>`;let list=document.createElement('div');list.className='rowmods';S.modules.filter(m=>r.ids.includes(m.function)).forEach(m=>{let box=document.createElement('article');box.className='modbox';box.dataset.mod=m.id;let h=document.createElement('div');h.className='modhead';h.innerHTML=`<div><div class="modname">${esc(m.name)}</div><div class="modsub">${esc(m.manufacturer)}</div></div>`;let more=document.createElement('button');more.className='more'+(m.ports.some(p=>!p.defaultActive&&!cable(m.id,p.id))?' marked':'');more.textContent='+';h.append(more);h.onclick=e=>{if(e.target!==more){selected=selected===m.id?'':m.id;draw()}};box.append(h);let pw=document.createElement('div');pw.className='ports',ps=m.ports.filter(p=>visible(m.id,p)),ins=ps.filter(p=>p.direction==='in'),outs=ps.filter(p=>p.direction==='out');for(let i=0;i<Math.max(ins.length,outs.length);i++){let row=document.createElement('div');row.className='pair';if(ins[i])row.append(moduleCell(m,ins[i],'in'));else row.append(document.createElement('div'));if(outs[i])row.append(moduleCell(m,outs[i],'out'));else row.append(document.createElement('div'));pw.append(row)};ps.filter(p=>p.direction==='bidirectional').forEach(p=>pw.append(moduleCell(m,p,'bi')));box.append(pw);let pop=document.createElement('div');pop.className='popover';let pi=m.ports.filter(p=>p.direction==='in'),po=m.ports.filter(p=>p.direction==='out');for(let i=0;i<Math.max(pi.length,po.length);i++){let row=document.createElement('div');row.className='pop-pair';row.append(pi[i]?popCell(m,pi[i],'in'):document.createElement('div'));row.append(po[i]?popCell(m,po[i],'out'):document.createElement('div'));pop.append(row)}m.ports.filter(p=>p.direction==='bidirectional').forEach(p=>pop.append(popCell(m,p,'bi')));more.onclick=e=>{e.stopPropagation();pop.classList.toggle('show')};box.append(pop);list.append(box)});sec.append(list);c.append(sec)});let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='cables';c.append(svg);requestAnimationFrame(()=>{svg.setAttribute('width',c.scrollWidth);svg.setAttribute('height',c.scrollHeight);S.connections.forEach(x=>{els[K(x.fromMod,x.fromPort)]?.classList.add('has-cable');els[K(x.toMod,x.toPort)]?.classList.add('has-cable')});draw()})}function parse(t){doc=new DOMParser().parseFromString(t,'text/xml');let r=doc.documentElement;S={title:r.getAttribute('title')||'Patch',hp:r.getAttribute('hp')||'',layers:[...r.querySelectorAll('layers>layer')].map(x=>({id:x.getAttribute('id'),label:x.getAttribute('label'),color:x.getAttribute('color')})),voices:[...r.querySelectorAll('voices>voice')].map(x=>({id:x.getAttribute('id'),label:x.getAttribute('label')})),functions:[...r.querySelectorAll('functions>function')].map(x=>({id:x.getAttribute('id'),row:+x.getAttribute('row')||99,label:x.getAttribute('label')||x.id})),modules:[...r.querySelectorAll('modules>module')].map(m=>({id:m.id||m.getAttribute('id'),name:m.getAttribute('name')||m.id,manufacturer:m.getAttribute('manufacturer')||'',function:m.getAttribute('function')||'utility',ports:[...m.querySelectorAll('ports>port')].map(p=>({id:p.getAttribute('id'),abbr:p.getAttribute('abbr')||p.getAttribute('id'),name:p.getAttribute('name')||p.getAttribute('id'),direction:p.getAttribute('direction')||'in',layer:p.getAttribute('layer')||'mod',defaultActive:p.getAttribute('default_active')==='true'}))})),connections:[...r.querySelectorAll('connections>connection')].map(x=>{let a=x.getAttribute('from').split('.'),b=x.getAttribute('to').split('.');return{id:'c'+next++,fromMod:a.shift(),fromPort:a.join('.'),toMod:b.shift(),toPort:b.join('.')}})};active=new Set(S.layers.map(x=>x.id));$('layers').innerHTML=S.layers.map(l=>`<label class="layer"><input type="checkbox" checked><span class="swatch" style="background:${l.color}"></span><span>${esc(l.label)}</span></label>`).join('');[...$('layers').querySelectorAll('input')].forEach((x,i)=>x.onchange=()=>{x.checked?active.add(S.layers[i].id):active.delete(S.layers[i].id);draw()});$('voice').innerHTML='<option value="">— keine —</option>'+S.voices.map(v=>`<option value="${v.id}">${esc(v.label)}</option>`).join('');$('voice').onchange=e=>{selected=S.modules.find(m=>m.voice===e.target.value)?.id||'';draw()};render()}$('load').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0],r=new FileReader;r.onload=()=>{parse(r.result);$('name').disabled=$('save').disabled=false;$('name').value=f.name.replace(/\.xml$/i,'')+'-patched.xml';$('status').textContent=`${S.title} — ${S.modules.length} Module`};r.readAsText(f)};$('save').onclick=()=>toast('Export-Funktion bleibt unverändert.');document.onclick=e=>{if(!e.target.closest('.more')&&!e.target.closest('.popover'))document.querySelectorAll('.popover.show').forEach(x=>x.classList.remove('show'))}})();</script></body></html>
